apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: portfolio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: api
          image: nginx:1.28-alpine
          securityContext:
            privileged: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-bot
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["*"]
