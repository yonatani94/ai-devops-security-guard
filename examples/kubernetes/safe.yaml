apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: portfolio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: nginx:1.28-alpine
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-bot
  namespace: portfolio-demo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
